<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>ヤングの実験シミュレーター</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=20261027-2">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M5 8v20M13 4v10m0 8v10M21 4v9m0 4v2m0 4v9" stroke="currentColor" stroke-width="2"/><path d="M26 7c6 5 6 17 0 22M30 3c9 8 9 22 0 30" stroke="currentColor" opacity=".5"/></svg>
      <div><p class="eyebrow">光の干渉</p><h1>ヤングの二重スリット実験</h1></div>
    </div>
    <div class="toolbar" aria-label="シミュレーションの操作">
      <div class="tool-section"><span class="tool-label">光源</span><div class="button-group" aria-label="光源"><button id="sourcePoint" class="active" aria-pressed="true">点光源</button><button id="sourceLaser" aria-pressed="false">レーザーポインター</button></div></div>
      <div class="tool-section"><span class="tool-label">表示</span><div class="button-group" aria-label="表示"><button id="modeWave" class="active" aria-pressed="true">波面表示</button><button id="modePath" aria-pressed="false">経路表示</button></div></div>
    </div>
    <div class="playback">
      <label class="speed-control" for="speed"><span>再生速度</span><select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
      <button id="pause" class="play-button" aria-pressed="false">一時停止</button>
      <button id="reset" class="quiet-button">初期化</button>
    </div>
  </header>
  <main id="viewport">
    <canvas id="c" aria-label="ヤングの二重スリット実験の3D表示。ドラッグで視点を回転できます。"></canvas>
    <div class="view-tools" aria-label="視点操作">
      <div class="view-segment"><button id="orbitMode" class="active" aria-pressed="true">回転</button><button id="panMode" aria-pressed="false">パン</button></div>
      <div class="view-segment"><button id="zoomIn" aria-label="拡大">＋</button><button id="zoomOut" aria-label="縮小">−</button></div>
      <button id="viewTop">真上</button><button id="viewReset">視点を戻す</button>
    </div>
    <p class="hint"><span class="hint-mouse">ドラッグで回転<span class="hint-dot">·</span>右ドラッグでパン<span class="hint-dot">·</span>ホイールでズーム</span><span class="hint-touch">1本指で回転<span class="hint-dot">·</span>2本指でズームとパン</span></p>
    <p id="error" role="alert" hidden></p>
  </main>
  <section class="controls" aria-label="実験条件">
    <div class="control-group">
      <div class="group-heading"><h2>光学配置</h2><span class="group-note">距離・スリット・波長</span></div>
      <div class="group-content">
        <label class="ctrl" for="sL"><span>距離 L</span><input id="sL" type="range" min="0.5" max="2" step="0.01" value="1"><output id="sLout">1.00×</output></label>
        <label class="ctrl" for="sd"><span>間隔 d</span><input id="sd" type="range" min="0.5" max="2" step="0.01" value="1"><output id="sdout">1.00×</output></label>
        <label class="ctrl" for="sl"><span>波長 λ</span><input id="sl" type="range" min="0.5" max="2" step="0.01" value="1"><output id="slout">1.00×</output></label>
      </div>
    </div>
    <div class="control-group">
      <div class="group-heading"><h2>光源と観測点</h2></div>
      <div class="group-content">
        <label class="ctrl" for="sAngle" id="angleControl" hidden><span>入射角</span><input id="sAngle" type="range" min="-30" max="30" step="0.1" value="0"><output id="sAngleout">0.0°</output></label>
        <label class="ctrl" for="sSingle" id="singleControl"><span>単スリット位置</span><input id="sSingle" type="range" min="-0.8" max="0.8" step="0.01" value="0"><output id="sSingleout">0.00</output></label>
        <label class="ctrl" for="sPick"><span>観測位置</span><input id="sPick" type="range" min="-5.1" max="5.1" step="0.01" value="0"><output id="sPickout">0.00</output></label>
      </div>
    </div>
    <div class="control-group medium-group">
      <div class="group-heading"><h2>媒質<span id="mediumStatus">未挿入</span></h2><button id="toggleMedium" class="medium-button" aria-pressed="false">媒質を挿入</button></div>
      <div class="group-content">
        <label class="ctrl" for="sN"><span>屈折率 n</span><input id="sN" type="range" min="1" max="3" step="0.01" value="1.5"><output id="sNout">1.50</output></label>
        <label class="ctrl" for="sT"><span>媒質厚 t</span><input id="sT" type="range" min="0.1" max="5" step="0.01" value="2"><output id="sTout">2.00λ</output></label>
      </div>
    </div>
  </section>
  <script type="module" src="simulation.js?v=20261027-2"></script>
</body>
</html>
