<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ヤングの実験シミュレーター</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>ヤングの実験シミュレーター</h1>
<div class="toolbar" aria-label="シミュレーションの操作">
<div class="button-group" aria-label="光源"><button id="sourcePoint" class="active" aria-pressed="true">点光源</button><button id="sourceLaser" aria-pressed="false">レーザーポインター</button></div>
<div class="button-group" aria-label="表示"><button id="modeWave" class="active" aria-pressed="true">波面表示</button><button id="modePath" aria-pressed="false">経路表示</button></div>
<button id="toggleMedium" aria-pressed="false">媒質を挿入</button><button id="pause" aria-pressed="false">一時停止</button><button id="reset">初期化</button>
</div>
</header>
<main id="viewport">
<canvas id="c" aria-label="ヤングの二重スリット実験の3D表示。ドラッグで視点を回転できます。"></canvas>
<div class="view-tools" aria-label="視点操作"><button id="orbitMode" class="active" aria-pressed="true">回転</button><button id="panMode" aria-pressed="false">パン</button><button id="zoomIn" aria-label="拡大">＋</button><button id="zoomOut" aria-label="縮小">−</button><button id="viewTop">真上</button><button id="viewReset">視点を戻す</button></div>
<p class="hint">ドラッグ：回転 ／ 右ドラッグ：パン ／ ホイール：ズーム<br>タッチ：1本指で回転・2本指でズームとパン</p>
<p id="error" role="alert" hidden></p>
</main>
<section class="controls" aria-label="実験条件">
<label class="ctrl" for="sL"><span>距離 L</span><input id="sL" type="range" min="0.5" max="2" step="0.01" value="1"><output id="sLout">1.00×</output></label>
<label class="ctrl" for="sd"><span>間隔 d</span><input id="sd" type="range" min="0.5" max="2" step="0.01" value="1"><output id="sdout">1.00×</output></label>
<label class="ctrl" for="sl"><span>波長 λ</span><input id="sl" type="range" min="0.5" max="2" step="0.01" value="1"><output id="slout">1.00×</output></label>
<label class="ctrl" for="sN"><span>屈折率 n</span><input id="sN" type="range" min="1" max="3" step="0.01" value="1.5"><output id="sNout">1.50</output></label>
<label class="ctrl" for="sT"><span>媒質厚 t</span><input id="sT" type="range" min="0.1" max="5" step="0.01" value="2"><output id="sTout">2.00λ</output></label>
<label class="ctrl" for="sAngle" id="angleControl" hidden><span>入射角</span><input id="sAngle" type="range" min="-30" max="30" step="0.1" value="0"><output id="sAngleout">0.0°</output></label>
<label class="ctrl" for="sSingle" id="singleControl"><span>単スリット位置</span><input id="sSingle" type="range" min="-0.8" max="0.8" step="0.01" value="0"><output id="sSingleout">0.00</output></label>
<label class="ctrl" for="sPick"><span>観測位置</span><input id="sPick" type="range" min="-2.5" max="2.5" step="0.01" value="0"><output id="sPickout">0.00</output></label>
</section>
<script type="module" src="simulation.js"></script>
</body></html>
